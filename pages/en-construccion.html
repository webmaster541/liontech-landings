<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Próximamente nuevas novedades de Lion Tech Venezuela.">
  <link rel="canonical" href="https://liontechve.com/proximamente">
  <meta property="og:title" content="En Construcción — Lion Tech">
  <meta property="og:description" content="Próximamente nuevas novedades de Lion Tech Venezuela.">
  <meta property="og:image" content="https://liontechve.com/images/favicon-liontech.png">
  <meta property="og:url" content="https://liontechve.com/proximamente">
  <meta property="og:type" content="website">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Próximamente | En Construcción — Lion Tech</title>
  <link rel="icon" type="image/png" href="../images/favicon-liontech.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #000B21;
      --primary: #0C6CC0;
      --accent: #38BDF8;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 35%, #001A4E 0%, #000B21 65%, #000614 100%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
      text-align: center;
    }
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(12, 108, 192, 0.28) 0%, rgba(56, 189, 248, 0.08) 50%, transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(50px);
      z-index: 0;
    }
    .content-wrap {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      height: 110px;
      max-width: 280px;
      width: auto;
      object-fit: contain;
      margin-bottom: 28px;
      filter: drop-shadow(0 6px 20px rgba(56, 189, 248, 0.25));
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
    }
    .status-text {
      font-family: var(--font-display, 'Outfit', sans-serif);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #38BDF8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-text::before,
    .status-text::after {
      content: "";
      display: inline-block;
      width: 24px;
      height: 1px;
      background: rgba(56, 189, 248, 0.5);
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 18px;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }
    p {
      color: #94A3B8;
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 560px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.35);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(56, 189, 248, 0.5);
      border-color: rgba(56, 189, 248, 0.8);
      color: #FFFFFF;
    }
    .contact-hint {
      margin-top: 32px;
      font-size: 0.9rem;
      color: #64748B;
    }
    .contact-hint a {
      color: #38BDF8;
      text-decoration: none;
      font-weight: 600;
    }
    .contact-hint a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <main class="content-wrap">
    <img src="../images/LogoBlanco.png" alt="Lion Tech Venezuela" class="logo">
    <div class="status-text">En Construcción</div>
    <h1 id="pageTitle">Experiencia en Desarrollo</h1>
    <p id="pageDescription">
      Estamos preparando una experiencia digital exclusiva para esta sección. Muy pronto estará disponible con todo el catálogo, garantías y servicios oficiales.
    </p>
    <a href="index.html" class="action-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Regresar al Inicio
    </a>
    <div class="contact-hint">
      ¿Necesitas atención inmediata? <a href="https://wa.me/584129777736" target="_blank" rel="noopener noreferrer">Contáctanos por WhatsApp</a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sitio = params.get('sitio');
    const titleEl = document.getElementById('pageTitle');
    const descEl = document.getElementById('pageDescription');
    const logoEl = document.querySelector('.logo');
    const faviconEl = document.querySelector('link[rel="icon"]');

    if (sitio === 'hitreek') {
      document.title = 'Hi-Treek — En Construcción | Lion Tech';
      titleEl.textContent = 'Hi-Treek Oficial';
      descEl.textContent = 'La landing oficial de Hi-Treek se encuentra actualmente en construcción y optimización. Estará disponible muy pronto.';
      if (faviconEl) faviconEl.href = 'images/favicon-hitreek.png';
      if (logoEl) {
        logoEl.src = 'images/LOGO HI-TREEK PNG.png';
        logoEl.alt = 'Hi-Treek';
        logoEl.style.height = '120px';
      }
    } else if (sitio === 'mechanic') {
      document.title = 'Mechanic Venezuela — En Construcción | Lion Tech';
      titleEl.textContent = 'Mechanic Venezuela';
      descEl.textContent = 'La landing de repuestos, herramientas y maquinarias Mechanic Venezuela está en construcción. Pronto podrás ver todo el catálogo especializado.';
      if (faviconEl) faviconEl.href = 'images/mechanicve.jpg';
      if (logoEl) {
        logoEl.src = 'images/MECHANIC PNG AMARILLO.png';
        logoEl.alt = 'Mechanic Venezuela';
        logoEl.style.height = '120px';
      }
    } else if (sitio === 'care') {
      document.title = 'Lion Tech Care+ — En Construcción | Lion Tech';
      titleEl.textContent = 'Lion Tech Care+';
      descEl.textContent = 'Nuestro laboratorio especializado de servicio técnico de alta gama está preparando su nuevo portal. Pronto disponible.';
      if (faviconEl) faviconEl.href = 'images/liontechcareve.jpg';
      if (logoEl) {
        logoEl.src = 'images/care-logo-transparent.png';
        logoEl.alt = 'Lion Tech Care+';
        logoEl.style.height = '130px';
      }
    }
  </script>
</body>
</html>
