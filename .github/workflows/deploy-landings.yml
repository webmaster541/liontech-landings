name: Deploy landings públicas

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - 'videos/**'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo privado (fuente)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verificar y forzar descarga LFS
        run: |
          set -e
          git lfs pull
          echo "--- Tamaños en videos/ ---"
          ls -la videos/
          echo "--- Verificando que no queden punteros LFS ---"
          for f in videos/*; do
            if head -c 40 "$f" | grep -q "git-lfs.github.com"; then
              echo "ERROR: $f sigue siendo un puntero LFS, no el binario real"
              exit 1
            fi
          done
          echo "OK: todos los videos son binarios reales"

      - name: Checkout repo publico (destino)
        env:
          DEPLOY_TOKEN: ${{ secrets.LANDINGS_DEPLOY_TOKEN }}
        run: |
          set -e
          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/webmaster541/liontech-landings.git" target
          cd target
          git checkout -B main
          git config user.name "LionTech Deploy Bot"
          git config user.email "deploy@liontechve.com"

      - name: Sincronizar solo los archivos publicados
        run: |
          set -e
          mkdir -p target/pages target/css target/js target/images target/videos
          rsync -a --delete pages/ target/pages/
          rsync -a --delete css/ target/css/
          rsync -a --delete js/ target/js/
          rsync -a --delete \
            --exclude 'Video1.MOV' \
            --exclude 'Video2.MOV' \
            --exclude 'Video3.MOV' \
            --exclude 'VideoCare.mp4' \
            images/ target/images/
          rsync -a --delete videos/ target/videos/
          find target/pages -maxdepth 1 -name 'mechanic-ve.backup*.html' -delete

      - name: Commit y push al repo publico
        working-directory: target
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Sync landings desde Landing_Liontech@${GITHUB_SHA}"
            git push -u origin main
          fi
